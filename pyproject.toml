[project]
name = "semantic-version-tools"
version = "1.5.0"
description = "Class to manage semantic versioning"
authors = [
    {name = "Romolo Politi",email = "romolo.politi@inaf.it"}
]
readme = "README.md"
requires-python = ">=3.10,<3.16"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
docstring-code-format = true
